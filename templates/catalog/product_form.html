{% extends "base.html" %}
{% block title %}Product{% endblock %}
{% block content %}
<h1 class="h3">{% if object %}Edit product{% else %}New product{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {% include "includes/form.html" %}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-link" href="{% url 'catalog:product-list' %}">Cancel</a>
</form>
{% endblock %}
